apiVersion: apps/v1
kind: Deployment

metadata:
  name: serverops
  namespace: serverops

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: serverops

  template:
    metadata:
      labels:
        app: serverops

    spec:
      nodeSelector:
        kubernetes.io/hostname: worker

      containers:

        - name: nginx
          image: 192.168.44.132:5000/serverops-nginx:1.1.0

          ports:
            - containerPort: 80

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf

        - name: php
          image: 192.168.44.132:5000/serverops-php:1.2.0

          ports:
            - containerPort: 9000

          env:
            - name: DB_HOST
              value: mysql

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_DATABASE

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD

      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
